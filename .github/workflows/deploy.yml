name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js app
        run: npm run build
        env:
          # Provide a dummy DATABASE_URL so Prisma doesn't error during build check
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://user:pass@localhost:3306/okuns' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'build-check-secret' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}

  # Hostinger Node.js Web App auto-deploys from GitHub on push to main.
  # No additional deploy step needed — Hostinger handles it automatically
  # once you connect this repo in hPanel → Node.js Web App settings.
  notify:
    name: Deployment Notice
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deployment triggered
        run: |
          echo "✅ Build passed. Hostinger will now auto-deploy from the main branch."
          echo "Live URL will be available at your connected domain."
